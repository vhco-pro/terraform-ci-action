name: Scorecard
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  scorecard:
    if: github.event.repository.visibility == 'public'
    uses: vhco-pro/.github/.github/workflows/reusable-scorecard.yml@e03ad61274b2bf0738b36ed67dff1c376321fb64 # v1.2.4
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    with:
      publish_results: true
